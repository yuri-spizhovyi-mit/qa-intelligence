services:
  api:
    build:
      context: .
    ports:
      - "127.0.0.1:8000:8000"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    volumes:
      - qa-data:/var/lib/qa-intelligence

volumes:
  qa-data:
