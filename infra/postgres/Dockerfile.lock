FROM python:3.12-slim@sha256:4840d514c583a4d3d8cad3940e68dee6f0f6f3635c12fcd0a3d74c21a5b93a54
RUN pip install "pip==25.3" "pip-tools==7.5.2"
WORKDIR /locks
COPY requirements.txt requirements-postgres.in ./
RUN pip-compile --generate-hashes --no-emit-index-url --no-emit-trusted-host --constraint requirements.txt --output-file requirements-postgres.txt requirements-postgres.in
